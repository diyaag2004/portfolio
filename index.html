<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Redirect to the new portfolio after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=https://diya-ag.vercel.app/">
    <title>Redirecting to Diya's New Portfolio...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f0f2f5; /* Light background */
            color: #333; /* Darker text for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff; /* White container */
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        h1 {
            color: #1a2a4a; /* Dark blue heading */
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .countdown {
            font-size: 1.5em;
            font-weight: bold;
            color: #007bff; /* Blue countdown text */
            margin-bottom: 30px;
        }

        .fallback-link {
            font-size: 0.95em;
            color: #555;
        }

        .fallback-link a {
            color: #0056b3; /* Standard link blue */
            text-decoration: none;
            font-weight: bold;
        }

        .fallback-link a:hover {
            text-decoration: underline;
        }

        /* Simple spinner */
        .spinner {
          border: 4px solid rgba(0, 0, 0, 0.1);
          width: 36px;
          height: 36px;
          border-radius: 50%;
          border-left-color: #007bff;
          margin: 20px auto; /* Center the spinner */

          animation: spin 1s ease infinite;
        }

        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Moving to a New Space!</h1>
        <p>Diya's portfolio has a new home. You'll be automatically redirected.</p>
        <div class="spinner"></div>
        <div class="countdown">
            Redirecting in <span id="timer">3</span> seconds...
        </div>
        <p class="fallback-link">
            If redirection doesn't work, <a href="https://diya-ag.vercel.app/">click here</a>.
        </p>
    </div>

    <script>
        let seconds = 3;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            seconds--;
            timerElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                // Optionally hide countdown or show "Redirecting now..."
                // document.querySelector('.countdown').textContent = "Redirecting now...";
            }
        }, 1000);
    </script>
</body>
</html>
